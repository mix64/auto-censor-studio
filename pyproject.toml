[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-censor-studio"
version = "0.1.0"
description = "Local PNG mosaic editor with contour masks and batch review"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dynamic = ["dependencies"]

[project.gui-scripts]
auto-censor-studio = "auto_censor_studio.__main__:main"

[project.optional-dependencies]
dev = ["ruff==0.15.6", "build>=1.2", "pyinstaller==6.22.3"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["auto_censor_studio*"]

[tool.setuptools.package-data]
auto_censor_studio = ["assets/*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
